[tools]
python = "3.12"
uv = "0.12"

[tasks.setup]
description = "Create the venv with dev dependencies"
run = "uv sync"

[tasks.test]
description = "Run the tests"
run = "uv run pytest"

[tasks.lint]
description = "Lint and check formatting"
run = ["uv run ruff check", "uv run ruff format --check"]

[tasks.zips]
description = "Build dist/zips/<dataset>.zip for a data release and rewrite registry.txt"
run = "uv run python scripts/build_zips.py"

[tasks.build]
description = "Build the wheel and sdist"
run = "uv build"
