[tools]
python = "3.12"
uv = "0.12"

[tasks.setup]
description = "Create the venv with dev dependencies"
run = "uv sync"

[tasks.test]
description = "Run the tests, including the registry hash check"
run = "uv run pytest"

[tasks.lint]
description = "Lint and check formatting"
run = ["uv run ruff check", "uv run ruff format --check"]

[tasks.registry]
description = "Rewrite registry.txt from the dataset files staged in git"
run = "uv run python scripts/make_registry.py"

[tasks.build]
description = "Build the wheel and sdist"
run = "uv build"

[tasks.zips]
description = "Build one zip per dataset into dist/zips/ for the GitHub data release"
run = "uv run python scripts/build_zips.py"
