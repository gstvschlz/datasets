name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run setup
      - run: mise run lint
      - run: mise run test

  publish:
    # A tag vX.Y.Z publishes the package to PyPI through trusted publishing (no token).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches __version__
        run: grep -q "^__version__ = \"${GITHUB_REF_NAME#v}\"$" src/geostats_datasets/__init__.py
      - uses: jdx/mise-action@v2
      - run: mise run build
      - uses: pypa/gh-action-pypi-publish@release/v1
