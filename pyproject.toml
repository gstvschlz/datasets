[project]
name = "geostats-datasets"
version = "0.1.0.dev0"
description = "Download mining and oil & gas geostatistics datasets by name."
readme = "README.md"
license = "CC-BY-4.0"
authors = [{ name = "Gustavo Pretto Scholze" }]
requires-python = ">=3.10"
dependencies = ["pooch>=1.7"]

[project.urls]
Repository = "https://github.com/gstvschlz/datasets"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts"]

[tool.ruff]
line-length = 100
# Dataset scripts are data provenance: reformatting them would change their published hashes.
extend-exclude = ["mining", "oil-gas"]
